name: Notify Feishu
on: push
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Feishu
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          MSG: "GitHub｜思宇 ${{ github.event.head_commit.message }}（${{ github.repository }}）"
        run: |
          jq -n --arg t "$MSG" '{msg_type:"text",content:{text:$t}}' \
          | curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
